<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bifura — Investigation</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<!--
  Design and motion references
  Layout · app-shell pattern (sidebar · top bar · work area · right inspector) seen in Manus and Perplexity; used as structure only.
  Spacing · 4-pt grid (Material Design 3 layout): every gap is 4, 8, 12, 16, 20, 24 or 32 px.
  Type · Material Design 3 type scale idea, tuned for a dense tool: 11 meta · 12 caption · 13 UI · 14 body · 15 lead · 20 title.
  Icons · Lucide-style 24px line icons, 1.75 stroke, drawn inline.
  Motion
   1. Apple, "Designing Fluid Interfaces" (WWDC 2018): graph, camera and focus ring run on damped springs (response + damping ratio).
   2. Material Design 3 motion: easing tokens standard (.2,0,0,1), emphasized-decelerate (.05,.7,.1,1), emphasized-accelerate (.3,0,.8,.15);
      duration tokens short4 200ms · medium2 300ms · long2 500ms; patterns: container transform (circle → card),
      shared axis X (inspector tabs), fade through (inspector content swap).
   3. Thomas & Johnston, "The Illusion of Life": anticipation, follow-through, slow-in/slow-out, overlapping action.
   4. Brysbaert (2019), J. Memory and Language: ~238 wpm silent reading → ~250 ms per word of narrative.
   5. Nielsen (1993) response-time limits: hover/press feedback ≤100 ms, each beat of the story ≈1 s.
-->
<style>
:root{--bg:#0d0d0e;--pn:#131314;--card:#18191b;--ln:#26272a;--ln2:#3c3d41;--ink:#ecebe7;--mut:#8d8b86;--acc:#ff6b3d;--sage:#8fd1a6;--blue:#7f9cf0;
--mono:"Geist Mono",ui-monospace,Menlo,monospace;--sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
--e-std:cubic-bezier(.2,0,0,1);--e-out:cubic-bezier(.05,.7,.1,1);--e-in:cubic-bezier(.3,0,.8,.15);--blend:screen;--hov:color-mix(in srgb,var(--ink) 6%,transparent);
box-sizing:border-box}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f3f1ec;--pn:#faf9f6;--card:#fff;--ln:#dedbd3;--ln2:#bdb9ae;--ink:#1b1a18;--mut:#6f6c64;--acc:#d4481a;--sage:#2f7d55;--blue:#5b7bd6;--blend:multiply}}
:root[data-theme="light"]{--bg:#f3f1ec;--pn:#faf9f6;--card:#fff;--ln:#dedbd3;--ln2:#bdb9ae;--ink:#1b1a18;--mut:#6f6c64;--acc:#d4481a;--sage:#2f7d55;--blue:#5b7bd6;--blend:multiply}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{color:var(--ink);font:13px/1.5 var(--sans);font-feature-settings:"tnum";overflow:hidden;-webkit-font-smoothing:antialiased;
 background:radial-gradient(900px 520px at 80% 8%,color-mix(in srgb,var(--acc) 9%,transparent),transparent 70%),radial-gradient(900px 620px at 30% 95%,color-mix(in srgb,#5b7bd6 10%,transparent),transparent 70%),var(--bg)}
button{font:500 13px var(--sans);color:var(--ink);background:none;border:0;cursor:pointer;padding:0}
.ic{width:16px;height:16px;flex:none}
.ibtn{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--mut);transition:background .15s var(--e-std),color .15s}
.ibtn:hover{background:var(--hov);color:var(--ink)}.ibtn.on{color:var(--ink);background:var(--hov)}
.x{color:var(--acc)}.g{color:var(--sage)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:8px}

/* ── shell ─────────────────────────────── */
.app{position:fixed;inset:0;display:grid;grid-template-columns:var(--sw,248px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:100%;transition:grid-template-columns .4s var(--e-std)}
.app.mini{--sw:60px}

/* sidebar */
.side{display:flex;flex-direction:column;min-width:0;overflow:hidden;border-right:1px solid color-mix(in srgb,var(--ln) 70%,transparent);background:color-mix(in srgb,var(--pn) 70%,transparent);backdrop-filter:blur(16px)}
.brand{height:56px;display:flex;align-items:center;gap:8px;padding:0 12px 0 16px;flex:none}
.wm{display:flex;align-items:center;gap:10px;font:600 16px var(--sans);letter-spacing:-.01em;white-space:nowrap}
.wm svg{width:22px;height:22px;flex:none;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--acc) 55%,transparent))}
.brand .sp{flex:1}
.nav{padding:4px 8px;display:flex;flex-direction:column;gap:2px}
.nv{height:36px;display:flex;align-items:center;gap:12px;padding:0 10px;border-radius:8px;color:color-mix(in srgb,var(--ink) 88%,var(--mut));white-space:nowrap;font-size:13.5px;text-align:left;transition:background .15s var(--e-std)}
.nv:hover{background:var(--hov)}.nv.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.nv .ic{color:var(--mut)}.nv.on .ic{color:var(--ink)}
.nv .ct{margin-left:auto;font:500 11px var(--mono);color:var(--mut)}
.nv.prim{border:1px solid var(--ln);margin-bottom:6px}
.sh{padding:20px 18px 6px;font:500 11.5px var(--sans);color:var(--mut);white-space:nowrap}
.rn{height:34px;display:flex;align-items:center;gap:10px;padding:0 10px;margin:0 8px;border-radius:8px;font-size:13px;white-space:nowrap;color:color-mix(in srgb,var(--ink) 85%,var(--mut));transition:background .15s}
.rn:hover{background:var(--hov)}.rn.on{background:color-mix(in srgb,var(--ink) 9%,transparent);color:var(--ink)}
.rn i{width:7px;height:7px;border-radius:50%;flex:none;margin:0 4px;background:var(--mut);transition:background .6s}
.rn i.f{background:var(--acc)}.rn i.k{background:var(--sage)}
.rn span{overflow:hidden;text-overflow:ellipsis}
.rn small{margin-left:auto;font:11px var(--mono);color:var(--mut)}
.foot{margin-top:auto;padding:12px;display:flex;align-items:center;gap:10px;border-top:1px solid color-mix(in srgb,var(--ln) 70%,transparent);white-space:nowrap}
.av{width:28px;height:28px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 12px var(--sans);color:#fff;background:linear-gradient(135deg,var(--acc),#5b7bd6)}
.foot b{font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis}
.foot .ibtn{margin-left:auto}
.app.mini .lbl,.app.mini .sh,.app.mini .ct,.app.mini .rn span,.app.mini .rn small,.app.mini .foot b,.app.mini .foot .ibtn,.app.mini .wm b{opacity:0;pointer-events:none}
.lbl,.sh,.ct,.rn span,.rn small,.foot b,.wm b{transition:opacity .25s var(--e-std)}
.app.mini .brand{padding:0 14px}.app.mini .wm{display:none}
.hd .acts2{pointer-events:none}.st.done .hd .acts2{pointer-events:auto}

/* main */
.main{display:grid;grid-template-rows:56px minmax(0,1fr);min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:0 16px 0 24px;border-bottom:1px solid color-mix(in srgb,var(--ln) 60%,transparent)}
.ttl{display:flex;align-items:center;gap:8px;font:600 15px var(--sans);letter-spacing:-.01em;padding:6px 8px;margin-left:-8px;border-radius:8px;transition:background .15s}
.ttl:hover{background:var(--hov)}.ttl small{font:500 13px var(--sans);color:var(--mut)}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 55%,transparent);padding:3px 10px;border-radius:99px;white-space:nowrap;transition:color .6s,border-color .6s}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.ok{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 55%,transparent)}
.top .sp{flex:1}
.seg{display:flex;padding:3px;border:1px solid var(--ln);border-radius:10px;gap:2px}
.seg button{padding:4px 10px;border-radius:7px;font-size:12.5px;color:var(--mut);transition:background .2s var(--e-std),color .2s}
.seg button.on{background:color-mix(in srgb,var(--ink) 11%,transparent);color:var(--ink)}
.pill{font:500 11px var(--mono);border:1px solid var(--ln);color:var(--mut);padding:3px 10px;border-radius:99px;white-space:nowrap}

.work{display:grid;grid-template-columns:minmax(360px,432px) minmax(0,1fr) var(--iw,0px);grid-template-rows:minmax(0,1fr);min-height:0;transition:grid-template-columns .5s var(--e-out)}
.app.insp .work{--iw:400px}

/* ── story column ──────────────────────── */
#act{position:relative;overflow:auto;border-right:1px solid color-mix(in srgb,var(--ln) 60%,transparent);min-height:0}
.story{padding:24px 24px 16px;min-height:calc(100% - 60px)}
.brief{border:1px solid var(--ln);border-radius:16px;padding:16px 16px 8px;background:color-mix(in srgb,var(--card) 70%,transparent);margin-bottom:24px}
.brief h3{margin:0 0 8px;display:flex;align-items:center;gap:8px;font:500 12px var(--sans);color:var(--mut)}
.brief h3 .live{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:br 2.4s var(--e-std) infinite}
.brief.idle h3 .live{animation:none;background:var(--sage)}
@keyframes br{50%{opacity:.35}}
.brief h3 .clk{margin-left:auto;font:11px var(--mono)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:12px;padding:8px 0;border-top:1px solid var(--ln);font-size:13.5px}
.kv small{font:500 12px var(--sans);color:var(--mut);padding-top:1px}.kv b{font-weight:500}
.kv.got{grid-template-rows:0fr;padding:0;border-top-color:transparent;opacity:0;transition:opacity .5s var(--e-std),padding .5s var(--e-std),border-color .5s}
.kv.got.on{padding:8px 0;border-top-color:var(--ln);opacity:1}.kv.got>*{overflow:hidden}

ol{list-style:none;margin:0;padding:0}
.st{position:relative;display:flex;gap:12px}
.st:not(:last-child)::before,.st:not(:last-child)::after{content:"";position:absolute;left:13.5px;top:32px;bottom:4px;width:1px;background:var(--ln)}
.st:not(:last-child)::after{background:color-mix(in srgb,var(--ink) 70%,transparent);transform:scaleY(0);transform-origin:top;transition:transform 1.1s var(--e-std)}
.st.done::after{transform:scaleY(1)}
.gl{width:28px;height:28px;flex:none;position:relative;border-radius:50%;border:1px solid var(--ln);background:var(--pn);display:grid;place-items:center;color:var(--mut);transition:background .5s,border-color .5s,color .5s}
.gl .ic{width:14px;height:14px;transition:opacity .3s,transform .4s var(--e-out)}
.gl .ck{position:absolute;opacity:0;transform:scale(.6)}
.st.run .gl{border-color:var(--acc);color:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 14%,transparent)}
.st.run .gl::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);animation:ring 2.4s var(--e-std) infinite}
@keyframes ring{0%{opacity:.8;transform:scale(.85)}100%{opacity:0;transform:scale(1.35)}}
.st.done .gl{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.st.done .gl .si{opacity:0;transform:scale(.6)}.st.done .gl .ck{opacity:1;transform:none}
.bd{flex:1;min-width:0;padding:2px 0 20px}
.hd{display:flex;gap:8px;align-items:center;min-height:24px}
.st.done .hd{cursor:pointer}
.tt{font:500 14px var(--sans);letter-spacing:-.005em;color:var(--mut);transition:color .5s}
.st.run .tt,.st.done .tt{color:var(--ink)}
.tag{font:500 10.5px var(--mono);padding:1px 7px;border-radius:6px;border:1px solid var(--ln2);color:var(--mut);white-space:nowrap}
.tag.h{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent)}.tag.v{color:var(--sage);border-color:color-mix(in srgb,var(--sage) 55%,transparent)}
.hd .acts2{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .2s}
.st.done .hd .acts2{opacity:.75}.st.done:hover .hd .acts2{opacity:1}
.hd .ibtn{width:26px;height:26px;border-radius:7px}.hd .ibtn .ic{width:14px;height:14px}
.st.done.open .chv{transform:rotate(180deg)}.chv{transition:transform .4s var(--e-std)}
.find{display:grid;grid-template-rows:0fr;opacity:0;transition:grid-template-rows .5s var(--e-std),opacity .4s var(--e-std)}
.find>div{overflow:hidden;display:flex;gap:8px;align-items:baseline;font-size:13px;color:var(--mut)}
.find small{font:500 12px var(--sans);flex:none}
.find a{color:var(--ink);font-weight:500;cursor:pointer;text-decoration:underline;text-decoration-color:var(--ln2);text-underline-offset:3px;transition:color .15s,text-decoration-color .15s}
.find a:hover{color:var(--acc);text-decoration-color:var(--acc)}
.find .x2{color:var(--acc)}.find .g2{color:var(--sage)}
.st.done .find{grid-template-rows:1fr;opacity:1}.st.done .find>div{padding-top:4px}
.bw{display:grid;grid-template-rows:0fr;transition:grid-template-rows .6s var(--e-std)}
.bw>div{overflow:hidden;min-height:0}
.st.run .bw,.st.done.open .bw{grid-template-rows:1fr}
.say,.tech{margin:8px 0 0;opacity:0;transform:translateY(4px);filter:blur(3px);transition:opacity .5s var(--e-out),transform .5s var(--e-out),filter .5s var(--e-out)}
.say.in,.tech.in{opacity:1;transform:none;filter:none}
.say{font:400 15px/1.55 var(--sans);letter-spacing:-.006em;text-wrap:pretty;color:color-mix(in srgb,var(--ink) 92%,var(--mut))}
.tech{font:12px/1.6 var(--mono);color:var(--mut)}
body:not(.eng) .tech{display:none}body.eng .say{display:none}
.now{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12.5px;color:var(--mut);height:18px;opacity:0;transition:opacity .3s}
.now.on{opacity:1}.now i{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:br 1.6s var(--e-std) infinite}
.body{padding-top:8px;font:12px/1.65 var(--mono)}

.rise{animation:rs .6s var(--e-out) both}
@keyframes rs{from{opacity:0;transform:translateY(6px);filter:blur(3px)}}
.ln{color:var(--mut);padding:2px 0;white-space:pre-wrap}.ln b{color:var(--ink);font-weight:500}
.evl{display:grid;grid-template-columns:28px 88px 1fr;gap:0 8px}.evl>div{display:contents}.evl u{text-decoration:none;color:var(--mut)}.evl span{color:var(--mut)}.evl b{font-weight:500}
.box{border:1px solid var(--ln);border-radius:12px;background:color-mix(in srgb,var(--card) 80%,transparent);margin:8px 0 4px;overflow:hidden}
.tb{width:100%;border-collapse:collapse}.tb th{color:var(--mut);font-weight:400;text-align:left;padding:8px 12px;border-bottom:1px solid var(--ln)}
.tb td{padding:8px 12px;border-top:1px solid var(--ln)}.tb tr:nth-child(2) td{border-top:0}
.io{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:12px}
.dig{display:flex;align-items:center;gap:8px;width:100%;padding:10px 12px;border-top:1px solid var(--ln);font:500 12.5px var(--sans);color:var(--ink);transition:background .15s}
.dig:hover{background:var(--hov)}.dig .ic{width:14px;height:14px;color:var(--acc)}.dig span{margin-left:auto;color:var(--mut)}
.br{margin:8px 0}.br div{display:flex;justify-content:space-between;color:var(--ink)}.br div span:last-child{color:var(--mut)}
.br i{display:block;height:3px;background:var(--ln);margin-top:6px;border-radius:2px;overflow:hidden}
.br u{display:block;height:100%;width:0;background:var(--ln2);transition:width 1.4s var(--e-std)}.br.f u{background:var(--acc)}
.pol{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--ln)}.pol:first-child{border-top:0}
.pol .ic{width:14px;height:14px}.pol.B .ic{color:var(--acc)}.pol.A .ic{color:var(--sage)}
.pol em{margin-left:auto;font-style:normal;font-weight:500;font-size:11px}.pol.B em{color:var(--acc)}.pol.A em{color:var(--sage)}
.pol.B span{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--acc) 60%,transparent)}
.code{padding:6px 0}
.cl{display:flex;gap:12px;padding:0 12px;white-space:pre;border-left:2px solid transparent}
.cl u{text-decoration:none;color:var(--mut);width:20px;text-align:right;flex:none;opacity:.7}
.cl.hit{background:color-mix(in srgb,var(--acc) 14%,transparent);border-left-color:var(--acc);color:var(--acc)}
.cl.del{background:color-mix(in srgb,var(--acc) 11%,transparent);color:var(--acc);border-left-color:var(--acc)}
.cl.add{background:color-mix(in srgb,var(--sage) 14%,transparent);color:var(--sage);border-left-color:var(--sage)}
.term{padding:8px 12px}
.res{margin-top:8px;border:1px solid color-mix(in srgb,var(--sage) 50%,transparent);border-radius:16px;padding:16px;background:color-mix(in srgb,var(--card) 80%,transparent)}
.res h4{margin:0 0 4px;display:flex;align-items:center;gap:8px;font:600 15px var(--sans);letter-spacing:-.01em}.res h4 .ic{color:var(--sage)}
.res p{margin:0 0 12px;color:var(--mut);font-size:12.5px}
.rr{display:flex;gap:12px;padding:8px 0;border-top:1px solid var(--ln);font-size:13px}
.rr .tag{align-self:flex-start;flex:none;width:84px;text-align:center}
.cpy{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border:1px solid var(--ln2);border-radius:8px;font-size:12.5px;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--ink)}.btn .ic{width:14px;height:14px;color:var(--mut)}

/* player: pinned at the bottom of the story */
.player{position:sticky;bottom:0;display:flex;align-items:center;gap:8px;padding:12px 24px 16px;background:linear-gradient(to top,var(--bg) 55%,transparent);z-index:2}
.player .ibtn{border:1px solid var(--ln)}
.player .spd{width:auto;padding:0 10px;font:500 12px var(--mono)}
.segs{flex:1;display:flex;gap:4px;margin-left:4px}.segs i{flex:1;height:3px;border-radius:2px;background:var(--ln);position:relative;overflow:hidden}
.segs i::after{content:"";position:absolute;inset:0;background:var(--acc);transform:scaleX(0);transform-origin:left;transition:transform 1.2s var(--e-std)}
.segs i.on::after{transform:scaleX(.45)}.segs i.d::after{transform:scaleX(1);background:var(--ink)}

/* ── graph ─────────────────────────────── */
#stage{position:relative;min-width:0;overflow:hidden;
 background-image:linear-gradient(color-mix(in srgb,var(--ln) 20%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ln) 20%,transparent) 1px,transparent 1px),linear-gradient(color-mix(in srgb,var(--ln) 48%,transparent) 1px,transparent 1px),linear-gradient(90deg,color-mix(in srgb,var(--ln) 48%,transparent) 1px,transparent 1px);
 background-size:24px 24px,24px 24px,120px 120px,120px 120px;background-position:-1px -1px}
#stage::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 55%,var(--bg) 105%);pointer-events:none}
svg#sv{position:absolute;inset:0;width:100%;height:100%}
.gbar{position:absolute;z-index:2;left:20px;right:16px;top:16px;display:flex;align-items:center;gap:8px;pointer-events:none}
.gbar>*{pointer-events:auto}
.gbar h2{margin:0;font:500 13px var(--sans);display:flex;align-items:center;gap:8px}.gbar h2 .ic{color:var(--mut)}
.gbar .sp{flex:1}
.gbar .ibtn{background:color-mix(in srgb,var(--pn) 70%,transparent);border:1px solid var(--ln);backdrop-filter:blur(10px)}
.lg{position:absolute;left:20px;bottom:16px;display:flex;gap:16px;font:11px var(--mono);color:var(--mut);pointer-events:none;z-index:2}
.lg span::before{content:"";display:inline-block;width:18px;border-top:1.5px solid var(--ln2);margin-right:6px;vertical-align:middle}.lg .d::before{border-top-style:dashed}
.tel{position:absolute;right:16px;bottom:16px;font:11px var(--mono);color:var(--mut);z-index:2;pointer-events:none}
.hint{position:absolute;left:50%;bottom:44px;transform:translate(-50%,6px);z-index:2;display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--ln);border-radius:99px;
 background:color-mix(in srgb,var(--pn) 80%,transparent);backdrop-filter:blur(12px);font-size:12.5px;color:var(--mut);opacity:0;pointer-events:none;transition:opacity .5s var(--e-std),transform .5s var(--e-out)}
.hint.on{opacity:1;transform:translate(-50%,0)}.hint .ic{width:14px;height:14px;color:var(--acc)}

.n{cursor:pointer;opacity:0;transition:opacity .5s var(--e-std);color:var(--mut)}.n.vis{opacity:1}
.cd{fill:var(--card);stroke:var(--ln2);stroke-width:1;transition:stroke .5s,fill .5s;filter:drop-shadow(0 8px 16px rgba(0,0,0,.22))}
.n:hover .cd{stroke:var(--ink)}
.n.sel .cd{stroke:var(--ink);stroke-width:1.6}
.tg{font:500 8.5px var(--mono);fill:currentColor;letter-spacing:.2px}.lb{font:500 12px var(--sans);fill:var(--ink)}.sv{font:9.5px var(--mono);fill:var(--mut)}
.n text,.n use{transition:opacity .5s var(--e-std),fill .5s}
.n.orb text,.n.orb use{opacity:0}

<script>
/* Run data is injected by bifura.dashboard.viewer.get_dashboard_html():
   {runs:[<format_bundle_for_ui payload>, ...], active:<run_id or null>} */
const DATA=/*__BIFURA_DATA__*/null;

const $=s=>document.querySelector(s),NS='http://www.w3.org/2000/svg',sv=$('#sv'),app=$('#app');
const mk=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p&&p.appendChild(e);return e};
const ico=(id,cls='ic',st='')=>`<svg class="${cls}"${st?` style="${st}"`:''}><use href="#i-${id}"/></svg>`;
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const pad=n=>String(n).padStart(2,'0');
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
const has=v=>v!=null&&v!==''&&v!=='—';

/* springs (Apple WWDC18 "Designing Fluid Interfaces") */
const SP=(response,damping)=>({k:(2*Math.PI/response)**2,c:4*Math.PI*damping/response});
const P={launch:SP(1.0,.86),tilt:SP(.75,.55),land:SP(.62,.74),cam:SP(1.3,1),fx:SP(.7,.92),soft:SP(.9,1)};
class Spring{constructor(v,p=P.soft){this.v=this.t=v;this.vel=0;this.p=p}
 jump(v){this.v=this.t=v;this.vel=0}
 step(dt){if(RM){this.v=this.t;return}const a=-this.p.k*(this.v-this.t)-this.p.c*this.vel;this.vel+=a*dt;this.v+=this.vel*dt}}
const bez=(x1,y1,x2,y2)=>t=>{let s=t;for(let i=0;i<8;i++){const x=3*(1-s)**2*s*x1+3*(1-s)*s*s*x2+s**3-t,d=3*(1-s)**2*x1+6*(1-s)*s*(x2-x1)+3*s*s*(1-x2);if(Math.abs(d)<1e-6)break;s=Math.min(1,Math.max(0,s-x/d))}return 3*(1-s)**2*s*y1+3*(1-s)*s*s*y2+s**3};
const EZ=bez(.2,0,0,1);

/* ── run model ───────────────────────────── */
const RUNS=(DATA&&DATA.runs)||[];
const TI={task:'flag',decision:'branch','tool call':'term','tool result':'inbox',state:'db',output:'send',assertion:'cc',code:'code',
 event:'act',proposal:'send',policy:'shield',blocked:'shx',tool:'term'};
const ti=tag=>TI[tag]||'act';
let RUN=null,NR={},N=[],B={},E=[],G={cx:475,cy:295,w:1000},STEPS=[],lis=[],sgs=[];
let DEV=null,CODE_N=null,OUT_N=null,TRACE=[],ASSERTS=[],FAILED=[],DOWN=[],UP=[],PARENT=null,DONE=new Set();
let paused=false,speed=1,rid=0,t0=0,stage=0,verified=false;
const nd=id=>(NR.nodes&&NR.nodes[id])||{};
const fmtObj=o=>o&&typeof o==='object'?Object.entries(o).map(([k,v])=>`${k} = ${typeof v==='object'?JSON.stringify(v):v}`).join(', '):(o??'');
const dev=()=>RUN.deviation||{};
const expStr=()=>fmtObj(dev().expected)||dev().expected_behavior||RUN.expected_outcome;
const actStr=()=>fmtObj(dev().actual)||dev().observed_behavior||RUN.actual_summary;
const isFixture=()=>!!RUN.is_fixture;
const passed=()=>!!(RUN.verification&&RUN.verification.passed);
const failedRun=()=>!['succeeded','success','passed'].includes(String(RUN.status).toLowerCase());

function forward(id){const out=[],seen=new Set([id]),q=[id];
 while(q.length){const c=q.shift();for(const e of E)if(e.s===c&&!seen.has(e.t)&&B[e.t].tag!=='code'){seen.add(e.t);out.push([c,e.t]);q.push(e.t)}}return out}
function ancestors(id){const s=new Set(),q=[id];
 while(q.length){const c=q.shift();for(const e of E)if(e.t===c&&!s.has(e.s)&&!['code','assertion'].includes(B[e.s].tag)){s.add(e.s);q.push(e.s)}}
 return [...s].sort((a,b)=>B[a].i-B[b].i)}

/* ── graph build ─────────────────────────── */
const eg=$('#eg'),ng=$('#ng');
function buildGraph(){
 eg.innerHTML='';ng.innerHTML='';
 E.forEach(e=>{const a=B[e.s],b=B[e.t],dx=b.x-a.x,dy=b.y-a.y;let p,q,c1,c2;
  if(Math.abs(dx)>Math.abs(dy)*.55){const s=dx>0?1:-1;p=[a.x+s*62,a.y];q=[b.x-s*62,b.y];c1=[p[0]+s*45,p[1]];c2=[q[0]-s*45,q[1]]}
  else{const s=dy>0?1:-1;p=[a.x,a.y+s*27];q=[b.x,b.y-s*27];c1=[p[0],p[1]+s*40];c2=[q[0],q[1]-s*40]}
  const d=`M${p[0]} ${p[1]}C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${q[0]} ${q[1]}`;
  e.g=mk('g',{class:'e'+(e.inf?' inf':'')},eg);
  e.r=mk('path',e.inf?{d,class:'r'}:{d,class:'r',pathLength:1},e.g);
  e.m=mk('path',{d,fill:'none',stroke:'none'},e.g);
  e.L=e.m.getTotalLength();const mid=e.m.getPointAtLength(e.L/2);
  mk('circle',{cx:q[0],cy:q[1],r:2.4,class:'tip'},e.g);
  mk('text',{x:mid.x,y:mid.y-7,class:'el'},e.g).textContent=e.k});
 N.forEach(n=>{const g=mk('g',{class:'n'},ng);n.g=g;
  n.rc=mk('rect',{class:'cd',width:124,height:54,rx:10},g);
  mk('use',{href:'#i-'+ti(n.tag),x:11,y:8,width:11,height:11},g);
  mk('text',{class:'tg',x:26,y:17},g).textContent=n.tag;
  mk('text',{class:'tg',x:112,y:17,'text-anchor':'end'},g).textContent='#'+pad(n.i+1);
  mk('text',{class:'lb',x:12,y:34},g).textContent=n.l.length>17?n.l.slice(0,16)+'…':n.l;
  n.se=mk('text',{class:'sv',x:12,y:46},g);n.se.textContent=clip(n.sub);
  n.S={x:new Spring(G.cx),y:new Spring(G.cy),s:new Spring(.6),r:new Spring(0),d:new Spring(0)};
  g.addEventListener('click',()=>openIns(n.id))})}
const clip=s=>{s=String(s??'');return s.length>22?s.slice(0,21)+'…':s};
const setP=(n,p)=>['x','y','s','r'].forEach(k=>n.S[k].p=p);
const jump=(n,x,y,s,r)=>{n.S.x.jump(x);n.S.y.jump(y);n.S.s.jump(s);n.S.r.jump(r)};
function shape(n,t){const w=20+104*t,h=20+34*t;n.rc.setAttribute('x',(124-w)/2);n.rc.setAttribute('y',(54-h)/2);n.rc.setAttribute('width',w);n.rc.setAttribute('height',h)}
function morph(n,ms){const id=n.tw=(n.tw||0)+1,t0=performance.now();(function f(now){if(n.tw!==id)return;const p=Math.min(1,(now-t0)/ms);shape(n,EZ(p));if(p<1)requestAnimationFrame(f)})(t0)}

const cam={x:new Spring(475,P.cam),y:new Spring(295,P.cam),w:new Spring(1000,P.cam)};
const fxS={x:new Spring(475,P.fx),y:new Spring(295,P.fx)};
/* zoom widths were tuned for a 1000-unit graph; scale them for wider live graphs so edge boxes stay visible */
const look=(x,y,w)=>{const k=Math.max(1,G.w/1000);cam.x.t=x;cam.y.t=y;cam.w.t=Math.min(G.w,w*k*1.15)},
 full=()=>{cam.x.t=G.cx;cam.y.t=G.cy;cam.w.t=G.w};
let last=performance.now();
(function frame(now){let dt=Math.min(.05,(now-last)/1000);last=now;const sub=4,h=dt/sub,ts=now/1000;
 for(let k=0;k<sub;k++){N.forEach(n=>{for(const s in n.S)n.S[s].step(h)});for(const s in cam)cam[s].step(h);fxS.x.step(h);fxS.y.step(h)}
 N.forEach(n=>{const S=n.S,a=S.d.v,ox=Math.sin(ts*.7+n.i*1.7)*5*a,oy=Math.cos(ts*.55+n.i*2.3)*4*a;
  n.g.setAttribute('transform',`translate(${S.x.v+ox} ${S.y.v+oy}) rotate(${S.r.v}) scale(${Math.max(.01,S.s.v)}) translate(-62 -27)`)});
 const w=cam.w.v;sv.setAttribute('viewBox',`${cam.x.v-w/2} ${cam.y.v-w*.28} ${w} ${w*.56}`);
 $('#fx').setAttribute('transform',`translate(${fxS.x.v} ${fxS.y.v})`);
 requestAnimationFrame(frame)})(last);

function focus(id,label,ok){const n=B[id],f=$('#fx');if(!n)return;fxS.x.t=n.x;fxS.y.t=n.y;if(!f.classList.contains('on')){fxS.x.jump(n.x);fxS.y.jump(n.y)}

    c.now('');const rr=await c.say(say('dev',`Found it. ${esc(d.description||d.observed_behavior||'This step produced the wrong value.')}${UP.length?'. Every step before this looks consistent.':''}`),

 if((pr&&(pr.candidates||[]).length)||(pr&&pr.abstained)||mt.length){

 if(DEV&&DOWN.length){

    c.now('');await sleep(1000);
    c.find('Fix',fnd('fix','')||[fix&&'1 line changed in a safe copy',blk&&`${plural(blk,'risky action')} blocked`,rev&&`${rev} sent for review`,!fix&&alw&&`${alw} allowed`].filter(Boolean).join(' · ')||'no actions to check',at.id)}})}

    if(ok&&DEV){const chain=[...(PARENT?[[PARENT.id,DEV.id]]:[]),...DOWN];
     if(!PARENT){DEV.g.classList.remove('dev');DEV.g.classList.add('fixed');rip(DEV.id,'ok')}
     for(const[a,b]of chain){await pulse(a,b,'var(--sage)',650);const n=B[b],q=nd(b);if(q.fixed_sub){n.sub=q.fixed_sub;n.se.textContent=clip(q.fixed_sub)}if(q.fixed_o)n.o=q.fixed_o;

    await sleep(rr*.6);c.find('Verdict',ok?(isFixture()?'Fixed on the sample scenario (simulated)':'Fixed and verified by replay'):'Not fixed yet',OUT_N.id,ok?'g2':'x2')}})}

   li.classList.add('run');sgs[i].className='on';$('#stx').textContent=`Step ${i+1} of ${STEPS.length}`;
   const a=$('#act');a.scrollTo({top:Math.max(0,li.offsetTop-a.clientHeight*.2),behavior:'smooth'});
   await sleep(250);const r=await c.say(STEPS[i].say,STEPS[i].tech);await STEPS[i].run(c,r)}
  const l=lis[lis.length-1];l.classList.remove('run');l.classList.add('done');sgs[sgs.length-1].className='d';DONE.add(STEPS.at(-1).k);stage=STEPS.length;
  $('#brief').classList.add('idle');$('#stx').textContent='Investigation complete';
  if(verified){const c=$('#st');c.textContent=isFixture()?'Fix verified · sample':'Fix verified';c.classList.add('ok');renderRuns()}
  $('#hint').classList.add('on');setTimeout(()=>$('#hint').classList.remove('on'),6000);
  await sleep(500);
  $('#res').innerHTML=resultCard();$('#act').scrollTo({top:$('#act').scrollHeight,behavior:'smooth'})}catch(e){if(e!=='x')console.error(e)}}

setInterval(()=>{if(RUN&&!paused&&!$('#brief').classList.contains('idle')){t0++;$('#clk').textContent=pad(t0/60|0)+':'+pad(t0%60)}},1000);
$('#pp').onclick=()=>{if(!RUN)return;if(!started){main();return}paused=!paused;setPlay(paused)};
$('#sp2').onclick=e=>{speed=speed===1?1.5:speed===1.5?2:1;e.currentTarget.textContent=speed+'×'};
$('#rs').onclick=()=>main();
$('#go').onclick=()=>main();
$('#nx').onclick=next;
document.querySelectorAll('#md button').forEach(b=>b.onclick=()=>setMode(b.dataset.m));
/* show/hide the story panel; the graph re-fits once the column has finished resizing */
function setStory(show){app.classList.toggle('nostory',!show);$('#tgst').classList.toggle('on',show);
 $('#tgst').title=show?'Hide the story panel so the graph fills the screen (G)':'Show the story panel again (G)';
 $('#tgst span').textContent=show?'Hide story':'Show story';
 $('#fit').classList.toggle('on',!show);$('#fit').title=show?'Expand the graph to full width (G)':'Shrink the graph back (G)';
 $('#fit span').textContent=show?'Expand graph':'Exit full graph';
 setTimeout(()=>{full();moveInk()},520)}
$('#tgst').onclick=()=>setStory(app.classList.contains('nostory'));
$('#fit').onclick=()=>setStory(app.classList.contains('nostory'));
sv.addEventListener('dblclick',()=>{full();unfocus()});
$('#tgs').onclick=()=>{delete app.dataset.auto;app.classList.toggle('mini')};
document.querySelectorAll('.soon').forEach(b=>b.addEventListener('click',()=>toast('Not available yet. Only investigations are wired up so far.')));
document.querySelectorAll('#vw button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#vw button').forEach(x=>x.classList.toggle('on',x===b));document.body.classList.toggle('eng',b.dataset.v==='eng')});
const toast=t=>{const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200)};
const cp=(t,m)=>{(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast(m),()=>toast('Copy is blocked here. Select the text instead.'))};

/* ── boot ────────────────────────────────── */
if(DATA&&DATA.embedded)app.classList.add('embedded');
$('#runct').textContent=RUNS.length||'';
$('#incct').textContent=new Set(RUNS.flatMap(p=>(p.incident_matches||[]).map(m=>m.incident_id))).size||'';
const usable=RUNS.filter(p=>p.nodes&&p.nodes.length);
if(!usable.length){$('#st').textContent='No runs';$('#ttl').textContent='Bifura';$('#stx').textContent='Waiting for run bundles';$('#brief').classList.add('idle');
 $('#steps').innerHTML=`<div class="empty">${ico('inbox')}<div>No run bundles found.<br>Add RunBundle JSON files to <b>data/fixtures/</b> or <b>data/runs/</b>.</div></div>`}
else{load(usable.find(p=>p.run_id===(DATA&&DATA.active)||p.scenario_id===(DATA&&DATA.active))||usable[0]);
 setMode(DATA&&DATA.mode);ready();if(DATA&&DATA.autoplay)setTimeout(main,500)}
</script>
</body>
</html>
